<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashLock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  input {
    width: 100%; max-width: 280px; padding: 12px; font-size: 18px;
    text-align: center; letter-spacing: 8px; border: 2px solid #fff;
    background: transparent; color: #fff; border-radius: 6px; outline: none;
  }
  button {
    margin-top: 16px; width: 100%; max-width: 280px; padding: 12px;
    font-size: 16px; font-weight: bold; background: #fff; color: #000;
    border: none; border-radius: 6px; cursor: pointer;
  }
  #status { margin-top: 20px; font-size: 13px; opacity: 0.7; text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1 id="title">Masukkan PIN Untuk Unlock</h1>

<div id="lockScreen">
  <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="----">
  <button id="unlockBtn">UNLOCK</button>
</div>

<p id="status">Mengaktifkan senter...</p>

<audio id="loudAudio" loop preload="auto"></audio>

<script>
  const CORRECT_PIN = "1122";
  const FLASH_INTERVAL = 400;
  const ENFORCE_INTERVAL = 100;
  let stream = null;
  let track = null;
  let flashTimer = null;
  let enforceTimer = null;
  let isFlashing = false;
  let audioCtx = null;

  const title = document.getElementById("title");
  const lockScreen = document.getElementById("lockScreen");
  const pinInput = document.getElementById("pinInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const status = document.getElementById("status");
  const loudAudio = document.getElementById("loudAudio");

  function buildLoudTone() {
    const sr = 44100;
    const dur = 2;
    const samples = sr * dur;
    const buffer = new ArrayBuffer(44 + samples * 2);
    const view = new DataView(buffer);
    function writeStr(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }
    writeStr(0, "RIFF");
    view.setUint32(4, 36 + samples * 2, true);
    writeStr(8, "WAVE");
    writeStr(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sr, true);
    view.setUint32(28, sr * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeStr(36, "data");
    view.setUint32(40, samples * 2, true);
    for (let i = 0; i < samples; i++) {
      const t = i / sr;
      const val = Math.sin(2 * Math.PI * 440 * t) * 0.9;
      view.setInt16(44 + i * 2, val * 0x7FFF, true);
    }
    return URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
  }

  function ensureAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function startLoudAudio() {
    ensureAudioCtx();
    if (!loudAudio.src) loudAudio.src = buildLoudTone();
    loudAudio.volume = 1.0;
    loudAudio.play().catch(() => {});
  }

  function stopLoudAudio() {
    loudAudio.pause();
    loudAudio.currentTime = 0;
  }

  function pinVolumeMax() {
    if (loudAudio.paused) return;
    if (loudAudio.volume !== 1.0) loudAudio.volume = 1.0;
    if (loudAudio.muted) loudAudio.muted = false;
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function startEnforce() {
    if (enforceTimer) return;
    enforceTimer = setInterval(pinVolumeMax, ENFORCE_INTERVAL);
    loudAudio.addEventListener("volumechange", pinVolumeMax);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && isFlashing) {
        pinVolumeMax();
        if (loudAudio.paused) startLoudAudio();
      }
    });
    window.addEventListener("blur", () => {
      if (isFlashing) pinVolumeMax();
    });
  }

  function stopEnforce() {
    if (enforceTimer) { clearInterval(enforceTimer); enforceTimer = null; }
    loudAudio.removeEventListener("volumechange", pinVolumeMax);
  }

  async function initTorch() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });
      track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (!caps.torch) {
        status.textContent = "Perangkat tidak mendukung kontrol senter via browser.";
        return false;
      }
      return true;
    } catch (e) {
      status.textContent = "Gagal akses kamera: " + e.message;
      return false;
    }
  }

  async function setTorch(on) {
    if (!track) return;
    try {
      await track.applyConstraints({ advanced: [{ torch: on }] });
    } catch (e) {}
  }

  function startFlashing() {
    if (flashTimer || !track) return;
    isFlashing = true;
    let state = false;
    flashTimer = setInterval(async () => {
      state = !state;
      await setTorch(state);
    }, FLASH_INTERVAL);
    status.textContent = "Senter berkedip aktif. Volume dikunci maksimal.";
  }

  async function stopFlashing() {
    isFlashing = false;
    if (flashTimer) { clearInterval(flashTimer); flashTimer = null; }
    await setTorch(false);
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      track = null;
    }
    stopLoudAudio();
    stopEnforce();
    status.textContent = "Unlocked. Senter dan audio mati.";
  }

  async function cobaUnlock() {
    const input = pinInput.value.trim();
    if (input === CORRECT_PIN) {
      await stopFlashing();
      lockScreen.classList.add("hidden");
      title.textContent = "TERBUKA";
      pinInput.value = "";
    } else {
      pinInput.value = "";
      status.textContent = "PIN salah. Coba lagi.";
      pinInput.focus();
    }
  }

  unlockBtn.addEventListener("click", cobaUnlock);
  pinInput.addEventListener("keydown", (e) => { if (e.key === "Enter") cobaUnlock(); });

  document.addEventListener("click", () => {
    ensureAudioCtx();
    if (isFlashing) {
      if (loudAudio.paused) startLoudAudio();
      pinVolumeMax();
    }
  });

  (async () => {
    const ok = await initTorch();
    if (ok) {
      startFlashing();
      startLoudAudio();
      startEnforce();
    }
    pinInput.focus();
  })();
</script>

</body>
</html>
